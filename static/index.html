<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harness 工单 AI Agent</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        .header {
            text-align: center;
            color: white;
            margin-bottom: 20px;
        }
        .header h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }
        .header p {
            opacity: 0.9;
            font-size: 14px;
        }
        .chat-box {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 600px;
        }
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
        }
        .message {
            margin-bottom: 16px;
            display: flex;
        }
        .message.user {
            justify-content: flex-end;
        }
        .message.bot {
            justify-content: flex-start;
        }
        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.5;
        }
        .user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 6px;
        }
        .bot .message-content {
            background: white;
            color: #333;
            border: 1px solid #e0e0e0;
            border-bottom-left-radius: 6px;
        }
        .message-role {
            font-size: 12px;
            opacity: 0.7;
            margin-bottom: 4px;
        }
        .input-area {
            padding: 16px;
            border-top: 1px solid #eee;
            display: flex;
            gap: 12px;
        }
        .input-area input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 24px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .input-area input:focus {
            border-color: #667eea;
        }
        .input-area button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 24px;
            font-size: 14px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .input-area button:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        .input-area button:active {
            transform: translateY(0);
        }
        .status-bar {
            padding: 8px 20px;
            background: #e8f5e9;
            border-bottom: 1px solid #c8e6c9;
            font-size: 12px;
            color: #2e7d32;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            background: #4caf50;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .typing-indicator {
            display: inline-flex;
            gap: 4px;
        }
        .typing-indicator span {
            width: 6px;
            height: 6px;
            background: #999;
            border-radius: 50%;
            animation: typing 1.4s infinite ease-in-out;
        }
        .typing-indicator span:nth-child(1) { animation-delay: 0s; }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typing {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.5; }
            40% { transform: scale(1); opacity: 1; }
        }
        .system-message {
            text-align: center;
            font-size: 12px;
            color: #999;
            margin: 12px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🛠️ Harness 工单 AI Agent</h1>
            <p>企业级智能工单助手 · 支持查询、创建、催办、关闭、删除</p>
        </div>
        
        <div class="chat-box">
            <div class="status-bar">
                <span class="status-dot"></span>
                <span>服务状态: 正常运行 | API: http://localhost:8000</span>
            </div>
            
            <div class="messages" id="messages">
                <div class="message bot">
                    <div>
                        <div class="message-role">系统</div>
                        <div class="message-content">您好！我是工单智能助手，请问需要什么帮助？

支持的操作：
- 查询工单：查询我的工单、查询工单 WO2024001
- 创建工单：创建工单，标题为xxx，内容为xxx
- 催办工单：催办工单 WO2024001
- 关闭工单：关闭工单 WO2024001
- 删除工单：删除工单 WO2024001

⚠️ 关闭和删除为高危操作，需要二次确认</div>
                    </div>
                </div>
            </div>
            
            <div class="input-area">
                <input type="text" id="messageInput" placeholder="输入您的工单需求..." onkeydown="handleKeydown(event)">
                <button onclick="sendMessage()">发送</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8090/api/chat';
        let sessionId = 'chat-' + Date.now();
        let userId = 'user-' + Math.random().toString(36).substr(2, 9);

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const messages = document.getElementById('messages');
            const message = input.value.trim();
            
            if (!message) return;
            
            // 添加用户消息
            addMessage('user', message);
            input.value = '';
            
            // 添加加载状态
            const loadingId = addMessage('bot', '<div class="typing-indicator"><span></span><span></span><span></span></div>', true);
            
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        session_id: sessionId,
                        user_id: userId,
                        message: message,
                    }),
                });
                
                const data = await response.json();
                
                // 移除加载状态
                removeMessage(loadingId);
                
                if (data.code === '00000') {
                    addMessage('bot', data.data.message);
                    
                    // 处理二次确认
                    if (data.data.need_confirm) {
                        addMessage('bot', '⚠️ 这是高危操作，请确认是否继续？(回复"确认"或"取消")');
                    }
                } else {
                    addMessage('bot', `❌ 错误: ${data.message || '操作失败'}`);
                }
            } catch (error) {
                removeMessage(loadingId);
                addMessage('bot', `❌ 网络错误: ${error.message}`);
            }
            
            // 滚动到底部
            messages.scrollTop = messages.scrollHeight;
        }

        function addMessage(role, content, isLoading = false) {
            const messages = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;
            messageDiv.innerHTML = `
                <div>
                    <div class="message-role">${role === 'user' ? '我' : '助手'}</div>
                    <div class="message-content">${content}</div>
                </div>
            `;
            
            if (isLoading) {
                messageDiv.id = 'loading-message';
            }
            
            messages.appendChild(messageDiv);
            return isLoading ? 'loading-message' : null;
        }

        function removeMessage(id) {
            const element = document.getElementById(id);
            if (element) {
                element.remove();
            }
        }

        function handleKeydown(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }
    </script>
</body>
</html>
