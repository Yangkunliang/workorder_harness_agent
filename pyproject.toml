[project]
name = "workorder-harness-agent"
version = "0.1.0"
description = "Workorder Harness Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.1",
    "pydantic>=2.13.0",
    "pydantic-settings>=2.3.4",
    "sqlalchemy>=2.0.0",
    "pymysql>=1.1.0",
    "aiomysql>=0.2.0",
    "cryptography>=42.0.0",
    "redis>=5.0.0",
    "nacos-sdk-python>=2.0.0,<3.0.0",
    "langchain>=0.2.0",
    "langchain-openai>=0.1.0",
    "langgraph>=0.1.0",
    "tenacity>=8.0.0",
    "pybreaker>=1.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "langgraph-checkpoint-redis>=0.4.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
